[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-action-runtime"
version = "0.1.0"
description = "Reliable execution control for AI agent actions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MrRex168" }]
keywords = ["ai", "agents", "runtime", "tool-calling", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.urls]
Repository = "https://github.com/MrRex168/agent-action-runtime"

[tool.hatch.build.targets.wheel]
packages = ["src/action_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
