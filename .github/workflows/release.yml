name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Verify wheel version matches tag
        run: |
          python -m pip install --no-deps dist/*.whl
          PACKAGE_VERSION=$(python -c "from importlib.metadata import version; import action_runtime; v = version('agent-action-runtime'); assert action_runtime.__version__ == v; print(v)")
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION"
            exit 1
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
