[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-action-runtime"
version = "0.1.0"
description = "Reliable execution control for AI agent actions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MrRex168" }]
keywords = ["ai", "agents", "runtime", "tool-calling", "llm", "agentic-ai", "reliability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "build>=1.2", "twine>=5.0"]
openai = ["openai-agents>=0.3"]

[project.urls]
Homepage = "https://github.com/MrRex168/agent-action-runtime"
Repository = "https://github.com/MrRex168/agent-action-runtime"
Issues = "https://github.com/MrRex168/agent-action-runtime/issues"
Changelog = "https://github.com/MrRex168/agent-action-runtime/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/action_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
